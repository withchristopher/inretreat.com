<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>New Inretreat Map</title>

    <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <link
      href="https://api.tiles.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      #retreatMap {
        width: 100%;
        height: 100vh;
      }

      .mapboxgl-popup {
        max-width: 260px !important;
      }

      .mapboxgl-popup-content {
        background-color: #3b3c59;
        border-radius: 16px;
        font-family: "Roboto Slab", serif;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
        width: 245px !important;
        max-width: 78vw;
      }

      .mapboxgl-popup-content .popup-header {
        background-color: #3b3c59;
        color: #d6d3cd;
        padding: 1.25rem 1.25rem 0.8rem 1.25rem;
        text-align: left;
      }

      .mapboxgl-popup-content .popup-date {
        font-size: 0.85rem;
        font-style: italic;
        margin-bottom: 0.5rem;
        letter-spacing: 0.03em;
        color: #d6d3cd;
        white-space: normal;
        overflow-wrap: break-word;
        line-height: 1.25;
      }

      .mapboxgl-popup-content .popup-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.6rem;
        margin-bottom: 0.5rem;
      }

      .mapboxgl-popup-content .popup-title {
        font-size: 1.45rem;
        line-height: 1.15;
        margin: 0;
        text-transform: capitalize !important;
        flex: 1;
      }

      .mapboxgl-popup-content .popup-type {
        flex-shrink: 0;
        color: #ffffff;
        background: transparent;
        padding: 0;
        margin-top: 0.22rem;
        font-size: 0.58rem;
        line-height: 1;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 400;
        white-space: nowrap;
        text-align: right;
      }

      .mapboxgl-popup-content .popup-location {
        font-size: 0.92rem;
        line-height: 1.35;
        margin: 0;
      }

      .mapboxgl-popup-content .popup-footer {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0.6rem auto 1.3rem auto;
        width: 68%;
        min-width: 7.5rem;
        background-color: #b38d65;
        border-radius: 999px;
        color: #d6d3cd;
        text-transform: uppercase;
      }

      .mapboxgl-popup-content .popup-footer:hover {
        background-color: #a57b58;
      }

      .mapboxgl-popup-content .popup-footer a.popup-footer-link {
        display: block;
        width: 100%;
        padding: 0.52rem 0.8rem;
        color: inherit;
        text-decoration: none;
        text-align: center;
        box-sizing: border-box;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
      }

      .mapboxgl-popup-close-button {
        display: none;
      }

      .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip,
      .mapboxgl-popup-anchor-bottom-left .mapboxgl-popup-tip,
      .mapboxgl-popup-anchor-bottom-right .mapboxgl-popup-tip,
      .mapboxgl-popup-anchor-top .mapboxgl-popup-tip,
      .mapboxgl-popup-anchor-top-left .mapboxgl-popup-tip,
      .mapboxgl-popup-anchor-top-right .mapboxgl-popup-tip {
        border-top-color: #3b3c59;
        border-bottom-color: #3b3c59;
      }

      .mapboxgl-popup-anchor-left .mapboxgl-popup-tip {
        border-right-color: #3b3c59;
      }

      .mapboxgl-popup-anchor-right .mapboxgl-popup-tip {
        border-left-color: #3b3c59;
      }
    </style>
  </head>

  <body>
    <div id="retreatMap"></div>

    <script>
      mapboxgl.accessToken =
        "pk.eyJ1IjoiY2htYXh3ZWxsIiwiYSI6ImNrZ3huaWU3ZTA1Y3Yyc3F2OWl5dGNxa2EifQ.T7xxDj4SGjS5ib9X8jR1Wg";

      const RETREAT_LAYER_ID = "inretreat-locations-2";

      const map = new mapboxgl.Map({
        container: "retreatMap",
        style: "mapbox://styles/chmaxwell/clobuc1ol00vt01qxewlvbplx",
        center: [56.8, 7.4],
        zoom: 1.6,
        attributionControl: false,
        scrollZoom: false
      });

      function isValidValue(value) {
        return (
          value !== undefined &&
          value !== null &&
          String(value).trim() !== "" &&
          String(value).trim().toLowerCase() !== "undefined" &&
          String(value).trim().toLowerCase() !== "null"
        );
      }

      function firstValidValue() {
        for (let i = 0; i < arguments.length; i++) {
          if (isValidValue(arguments[i])) {
            return String(arguments[i]).trim();
          }
        }

        return "";
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function getSafeLink(link) {
        if (!isValidValue(link)) {
          return "#";
        }

        const cleanLink = String(link).trim();

        if (
          cleanLink.startsWith("http://") ||
          cleanLink.startsWith("https://")
        ) {
          return cleanLink;
        }

        return "https://" + cleanLink;
      }

      function formatText(value) {
        if (!isValidValue(value)) {
          return "";
        }

        return String(value)
          .replace(/-/g, " ")
          .replace(/_/g, " ")
          .replace(/\b\w/g, function (char) {
            return char.toUpperCase();
          });
      }

      map.on("load", function () {
        map.resize();

        if (!map.getLayer(RETREAT_LAYER_ID)) {
          console.warn(
            "Layer not found: " +
              RETREAT_LAYER_ID +
              ". Check the layer ID in Mapbox Studio."
          );
          return;
        }

        try {
          map.setLayerZoomRange(RETREAT_LAYER_ID, 0, 24);
        } catch (error) {
          console.warn("Could not set layer zoom range:", error);
        }

        map.on("mouseenter", RETREAT_LAYER_ID, function () {
          map.getCanvas().style.cursor = "pointer";
        });

        map.on("mouseleave", RETREAT_LAYER_ID, function () {
          map.getCanvas().style.cursor = "";
        });

        map.on("click", RETREAT_LAYER_ID, function (e) {
          const feature = e.features && e.features[0];

          if (!feature) {
            return;
          }

          const coordinates = feature.geometry.coordinates.slice();
          const properties = feature.properties || {};

          console.log("Clicked feature properties:", properties);

          const date =
            firstValidValue(
              properties.date,
              properties.Date,
              properties.dates,
              properties.Dates,
              properties.full_date,
              properties.fullDate,
              properties.retreat_date,
              properties.retreatDate,
              properties.start_date,
              properties.startDate
            ) || "Dates available on request";

          const title =
            firstValidValue(
              properties.title,
              properties.Title,
              properties.name,
              properties.Name
            ) || "Retreat";

          const location = firstValidValue(
            properties.location,
            properties.Location,
            properties.country,
            properties.Country
          );

          const type = formatText(
            firstValidValue(properties.type, properties.Type)
          );

          const link = getSafeLink(
            firstValidValue(properties.link, properties.Link)
          );

          const typeHtml = type
            ? '<div class="popup-type">' + escapeHtml(type) + "</div>"
            : "";

          const discoverHtml =
            link !== "#"
              ? '<div class="popup-footer">' +
                '<a href="' +
                escapeHtml(link) +
                '" class="popup-footer-link" target="_blank" rel="noopener noreferrer">' +
                "Discover" +
                "</a>" +
                "</div>"
              : "";

          const popupContent =
            '<div class="popup-header">' +
            '<div class="popup-date">' +
            escapeHtml(date) +
            "</div>" +
            '<div class="popup-title-row">' +
            '<div class="popup-title">' +
            escapeHtml(title) +
            "</div>" +
            typeHtml +
            "</div>" +
            '<div class="popup-location">' +
            escapeHtml(location) +
            "</div>" +
            "</div>" +
            discoverHtml;

          new mapboxgl.Popup()
            .setLngLat(coordinates)
            .setHTML(popupContent)
            .addTo(map);
        });
      });

      map.on("error", function (event) {
        console.error("Mapbox error:", event && event.error ? event.error : event);
      });
    </script>
  </body>
</html>
